<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emotion-Based Study Recommendation</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Roboto+Slab:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #e0f7fa 0%, #e6e6fa 100%);
            font-family: 'Poppins', sans-serif;
            overflow-x: hidden;
            color: #2d3748;
            margin: 0;
        }
        .container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 100vh;
            padding: 40px 60px;
            max-width: 1400px;
            margin: 0 auto;
            animation: fadeIn 1s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .webcam-feed {
            flex: 1;
            margin-right: 40px;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease;
        }
        .webcam-feed:hover {
            transform: scale(1.02);
        }
        .webcam-feed img {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 15px;
        }
        .recommendation-block {
            flex: 1;
            background: linear-gradient(145deg, #ffffff, #f9f9ff);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.15);
            backdrop-filter: blur(8px);
            height: fit-content;
            max-height: 250px;
            overflow-y: auto;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .recommendation-block:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2);
        }
        .recommendation-block h2 {
            font-family: 'Roboto Slab', serif;
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 20px;
            color: #1a202c;
            text-align: center;
            background: linear-gradient(90deg, #4a5568, #2d3748);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: gradientText 4s ease infinite;
        }
        @keyframes gradientText {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        #recommendation {
            font-size: 1.3rem;
            color: #2ecc71;
            white-space: normal;
            overflow-wrap: break-word;
            line-height: 1.6;
            padding: 10px 0;
            text-align: center;
            animation: fadeInText 1.5s ease-in-out;
        }
        @keyframes fadeInText {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        /* Custom scrollbar for recommendation block */
        .recommendation-block::-webkit-scrollbar {
            width: 8px;
        }
        .recommendation-block::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }
        .recommendation-block::-webkit-scrollbar-thumb {
            background: #4a5568;
            border-radius: 10px;
        }
        .recommendation-block::-webkit-scrollbar-thumb:hover {
            background: #2d3748;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="webcam-feed">
            <img src="{{ url_for('video_feed') }}" alt="Webcam Feed" style="width: 100%;">
        </div>
        <div class="recommendation-block">
            <h2>Emotion-Based Recommendation</h2>
            <p id="recommendation">Ensure your face is visible to start.</p>
        </div>
    </div>

    <script>
        // Function to fetch and update recommendation with fade effect
        function updateRecommendation() {
            fetch('/recommendation')
                .then(response => response.json())
                .then(data => {
                    const recommendationElement = document.getElementById('recommendation');
                    recommendationElement.style.opacity = '0';
                    setTimeout(() => {
                        recommendationElement.innerText = data.recommendation;
                        recommendationElement.style.opacity = '1';
                    }, 300);
                })
                .catch(error => console.error('Error fetching recommendation:', error));
        }

        // Update recommendation every second
        setInterval(updateRecommendation, 1000);

        // Initial fetch
        updateRecommendation();
    </script>
</body>
</html>
